<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 8 + Liquid Glass</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <div class="container">
        <header class="glass-header">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40">
                    <rect x="0" y="0" width="18" height="18" fill="currentColor"/>
                    <rect x="22" y="0" width="18" height="18" fill="currentColor"/>
                    <rect x="0" y="22" width="18" height="18" fill="currentColor"/>
                    <rect x="22" y="22" width="18" height="18" fill="currentColor"/>
                </svg>
                <span>Windows 8</span>
            </div>
            <nav>
                <a href="#" class="glass-button">Start</a>
                <a href="#" class="glass-button">Aplikace</a>
                <a href="#" class="glass-button">Nastavení</a>
            </nav>
            <div class="user-info">
                <div class="dark-mode-toggle" id="darkModeToggle">
                    <div class="dark-mode-toggle-slider">
                        <span class="dark-mode-toggle-icon"></span>
                    </div>
                </div>
                <div class="avatar glass-element"></div>
            </div>
        </header>

        <main class="tiles-grid">
            <div class="tile large glass-tile tile-red">
                <div class="tile-content">
                    <div class="icon">
                        <svg width="60" height="60" viewBox="0 0 60 60">
                            <rect x="5" y="5" width="50" height="50" rx="8" fill="none" stroke="currentColor" stroke-width="3"/>
                            <path d="M20 30 L30 40 L45 20" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <h2>Úkoly</h2>
                    <p class="tile-description">Spravujte své denní úkoly</p>
                    <div class="live-info">8 aktivních</div>
                </div>
            </div>

            <div class="tile medium glass-tile tile-magenta">
                <div class="tile-content">
                    <div class="icon">
                        <svg width="50" height="50" viewBox="0 0 50 50">
                            <circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="3"/>
                            <path d="M25 10 L25 25 L35 30" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <h2>Kalendář</h2>
                    <div class="live-info">Po 8. 11.</div>
                </div>
            </div>

            <div class="tile small glass-tile tile-coral">
                <div class="tile-content">
                    <div class="icon">
                        <svg width="40" height="40" viewBox="0 0 40 40">
                            <path d="M5 35 L35 35 L35 15 L20 5 L5 15 Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
                            <rect x="15" y="22" width="10" height="13" fill="currentColor"/>
                        </svg>
                    </div>
                    <h2>Domů</h2>
                </div>
            </div>

            <div class="tile small glass-tile tile-orange">
                <div class="tile-content">
                    <div class="icon">
                        <svg width="40" height="40" viewBox="0 0 40 40">
                            <circle cx="20" cy="15" r="8" fill="none" stroke="currentColor" stroke-width="3"/>
                            <path d="M5 35 Q5 25 20 25 T35 35" fill="none" stroke="currentColor" stroke-width="3"/>
                        </svg>
                    </div>
                    <h2>Lidé</h2>
                </div>
            </div>

            <div class="tile medium glass-tile tile-crimson">
                <div class="tile-content">
                    <div class="icon">
                        <svg width="50" height="50" viewBox="0 0 50 50">
                            <path d="M25 10 L30 20 L42 22 L33 30 L36 42 L25 36 L14 42 L17 30 L8 22 L20 20 Z" fill="currentColor"/>
                        </svg>
                    </div>
                    <h2>Oblíbené</h2>
                    <div class="live-info">12 položek</div>
                </div>
            </div>

            <div class="tile large glass-tile tile-rose">
                <div class="tile-content">
                    <div class="icon">
                        <svg width="60" height="60" viewBox="0 0 60 60">
                            <rect x="10" y="15" width="40" height="30" rx="3" fill="none" stroke="currentColor" stroke-width="3"/>
                            <path d="M10 20 L30 35 L50 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <h2>Pošta</h2>
                    <p class="tile-description">5 nových zpráv</p>
                    <div class="notification-badge">5</div>
                </div>
            </div>

            <div class="tile small glass-tile tile-pink">
                <div class="tile-content">
                    <div class="icon">
                        <svg width="40" height="40" viewBox="0 0 40 40">
                            <circle cx="20" cy="20" r="12" fill="none" stroke="currentColor" stroke-width="3"/>
                            <circle cx="20" cy="20" r="5" fill="currentColor"/>
                        </svg>
                    </div>
                    <h2>Fotky</h2>
                </div>
            </div>

            <div class="tile small glass-tile tile-amber">
                <div class="tile-content">
                    <div class="icon">
                        <svg width="40" height="40" viewBox="0 0 40 40">
                            <path d="M10 15 L20 10 L30 15 L30 30 L10 30 Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
                            <path d="M15 20 L15 30 M25 20 L25 30" stroke="currentColor" stroke-width="3"/>
                        </svg>
                    </div>
                    <h2>Hudba</h2>
                </div>
            </div>

            <div class="tile medium glass-tile tile-scarlet">
                <div class="tile-content">
                    <div class="icon">
                        <svg width="50" height="50" viewBox="0 0 50 50">
                            <rect x="8" y="12" width="34" height="26" rx="2" fill="none" stroke="currentColor" stroke-width="3"/>
                            <path d="M15 20 L15 30 M20 17 L20 30 M25 22 L25 30 M30 19 L30 30 M35 24 L35 30" stroke="currentColor" stroke-width="2.5"/>
                        </svg>
                    </div>
                    <h2>Statistiky</h2>
                    <div class="live-info">↑ 24%</div>
                </div>
            </div>

            <div class="tile small glass-tile tile-salmon">
                <div class="tile-content">
                    <div class="icon">
                        <svg width="40" height="40" viewBox="0 0 40 40">
                            <circle cx="20" cy="20" r="15" fill="none" stroke="currentColor" stroke-width="3"/>
                            <path d="M20 8 L20 20 L28 28" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <h2>Čas</h2>
                </div>
            </div>

            <div class="tile medium glass-tile tile-ruby">
                <div class="tile-content">
                    <div class="icon">
                        <svg width="50" height="50" viewBox="0 0 50 50">
                            <path d="M10 40 L10 30 Q10 20 20 20 L30 20 Q40 20 40 30 L40 40" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                            <circle cx="20" cy="15" r="5" fill="currentColor"/>
                            <circle cx="30" cy="15" r="5" fill="currentColor"/>
                        </svg>
                    </div>
                    <h2>Zprávy</h2>
                    <div class="notification-badge">3</div>
                </div>
            </div>

            <div class="tile small glass-tile tile-purple">
                <div class="tile-content">
                    <div class="icon">
                        <svg width="40" height="40" viewBox="0 0 40 40">
                            <path d="M12 30 L12 15 Q12 10 17 10 L23 10 Q28 10 28 15 L28 25 L32 30 L8 30 Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <h2>Alarmy</h2>
                </div>
            </div>
        </main>

        <footer class="glass-footer">
            <div class="footer-content">
                <div class="time-widget glass-element">
                    <div class="time" id="time">12:00</div>
                    <div class="date" id="date">Pondělí, 8. listopadu</div>
                </div>
                <div class="quick-actions">
                    <button class="glass-button icon-button">
                        <svg width="24" height="24" viewBox="0 0 24 24">
                            <path d="M12 2 L15 8 L22 9 L17 14 L18 21 L12 18 L6 21 L7 14 L2 9 L9 8 Z" fill="currentColor"/>
                        </svg>
                    </button>
                    <button class="glass-button icon-button">
                        <svg width="24" height="24" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="4" fill="currentColor"/>
                            <path d="M12 2 L12 6 M12 18 L12 22 M22 12 L18 12 M6 12 L2 12 M19 19 L16.5 16.5 M7.5 7.5 L5 5 M19 5 L16.5 7.5 M7.5 16.5 L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <button class="glass-button icon-button">
                        <svg width="24" height="24" viewBox="0 0 24 24">
                            <path d="M12 2 C6 2 2 6 2 12 C2 18 6 22 12 22 C18 22 22 18 22 12 C22 6 18 2 12 2 Z M16 13 L11 13 L11 7" fill="none" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
